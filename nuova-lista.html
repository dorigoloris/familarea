<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuova lista - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a href="#">Torna alle liste</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card">
      <div class="fa-section-hero-content">
        <h1>Nuova lista</h1>
        <p>Crea una nuova lista personale o condivisa.</p>
      </div>
    </header>
    <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento...</p>
    <form id="list-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card" hidden>
      <div><label for="title">Titolo *</label><input id="title" class="fa-v2-input" required></div>
      <div><label for="description">Descrizione</label><textarea id="description" class="fa-v2-textarea"></textarea></div>
      <div class="form-actions">
        <button id="save-button" class="fa-v2-button fa-v2-button--primary" type="submit">Crea lista</button>
        <a class="fa-v2-button fa-v2-button--secondary" href="#">Annulla</a>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="nuova-lista.js"></script>
</body>
</html>
