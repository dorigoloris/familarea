<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Recupera password - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <main class="fa-v2-page fa-v2-page-stack">
    <a class="fa-v2-button fa-v2-button--secondary" href="index.html">FamilArea</a>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="recovery-title"><div class="fa-section-hero-content"><p class="eyebrow">SICUREZZA</p><h1 id="recovery-title">Recupera password</h1><p>Riceverai un link sicuro per impostare una nuova password.</p></div></header>
    <form id="recovery-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack"><div><label for="email">Email</label><input id="email" class="fa-v2-input" type="email" autocomplete="email" required></div><div class="fa-v2-card-actions"><a id="back-to-login-link" class="fa-v2-button fa-v2-button--secondary" href="login.html">Torna ad Accedi</a><button id="recovery-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Invia link di recupero</button></div></form>
    <p id="message" class="fa-v2-status" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="auth-utils.js"></script>
  <script src="recupera-password.js"></script>
</body>
</html>
