<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposte - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="proposals-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page proposals-page">
    <header class="fa-section-hero" aria-labelledby="proposals-title">
      <div class="fa-section-hero-content">
        <p class="eyebrow">SCOPERTA</p>
        <h1 id="proposals-title">Proposte</h1>
        <p>Eventi in linea con i tuoi Interessi.</p>
      </div>
    </header>
    <p id="proposals-message" class="global-view-message" aria-live="polite">Caricamento proposte...</p>
    <section id="proposals-list" class="proposals-list" aria-label="Eventi proposti" hidden></section>
    <p id="proposals-empty" class="proposals-empty fa-empty-state" hidden><strong>Nessuna proposta al momento.</strong></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="proposte.js"></script>
</body>
</html>
