<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Tagliando - FamilArea</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const deadlineId = params.get('deadline_id');
    const target = new URL('nuova-scadenza.html', window.location.href);
    if (deadlineId) target.searchParams.set('deadline_id', deadlineId);
    window.location.replace(`${target.pathname.split('/').pop()}${target.search}${window.location.hash}`);
  </script>
</head>
<body>
  <p>Reindirizzamento a <a href="scadenze.html">Scadenze</a>&hellip;</p>
</body>
</html>
