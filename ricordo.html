<!DOCTYPE html>
<html lang="it" class="fa-mfa-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FamilArea">
  <meta name="theme-color" content="#0d2b4f">
  <title>Album - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app deadline-form-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card fa-page fa-page--wide fa-v2-page fa-v2-page-stack deadline-form-page">
    <p class="account-back-link"><a id="memory-back-link" href="timeline.html">Torna alla Timeline</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="memory-page-title">
      <div class="fa-section-hero-content">
        <h1 id="memory-page-title">Nuovo album</h1>
        <p id="memory-page-intro">Organizza le fotografie di un momento personale.</p>
      </div>
    </header>

    <p id="memory-message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento...</p>

    <form id="memory-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack" hidden>
      <div class="deadline-form-grid">
        <div>
          <label for="memory-occurred-on">Data *</label>
          <input id="memory-occurred-on" class="fa-v2-input" type="date" required>
        </div>
        <div>
          <label for="memory-title">Titolo *</label>
          <input id="memory-title" class="fa-v2-input" type="text" required maxlength="500" autocomplete="off">
        </div>
        <div class="form-field-wide">
          <label for="memory-description">Descrizione</label>
          <textarea id="memory-description" class="fa-v2-textarea" rows="7"></textarea>
        </div>
      </div>

      <section id="memory-photos-section" class="fa-v2-section-card fa-v2-section-card--compact fa-v2-card fa-v2-page-stack" aria-labelledby="memory-photos-title">
        <div class="deadline-attachments-heading">
          <div>
            <h2 id="memory-photos-title">Fotografie</h2>
            <p class="deadline-attachments-intro">JPG, PNG o WebP · massimo 10 MB.</p>
          </div>
          <label id="memory-photo-upload" class="btn secondary-button deadline-attachment-upload" for="memory-photo-input">+ Aggiungi fotografie</label>
          <input id="memory-photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        </div>
        <p id="memory-photos-message" class="deadline-attachments-message" aria-live="polite"></p>
        <p id="memory-photos-empty" class="deadline-attachments-empty">Nessuna fotografia.</p>
        <div id="memory-photos-list" class="deadline-attachments-list"></div>
      </section>

      <section id="memory-documents-section" class="fa-v2-section-card fa-v2-section-card--compact fa-v2-card fa-v2-page-stack" aria-labelledby="memory-documents-title" hidden>
        <div class="deadline-attachments-heading">
          <div>
            <h2 id="memory-documents-title">Documenti</h2>
            <p class="deadline-attachments-intro">PDF · massimo 10 MB.</p>
          </div>
          <label id="memory-document-upload" class="btn secondary-button deadline-attachment-upload" for="memory-document-input">+ Aggiungi documento</label>
          <input id="memory-document-input" type="file" accept="application/pdf" hidden>
        </div>
        <p id="memory-documents-message" class="deadline-attachments-message" aria-live="polite"></p>
        <p id="memory-documents-empty" class="deadline-attachments-empty">Nessun documento.</p>
        <div id="memory-documents-list" class="deadline-attachments-list"></div>
      </section>

      <div class="form-actions">
        <button id="memory-delete" class="fa-v2-button fa-v2-button--danger" type="button" hidden>Elimina album</button>
        <a id="memory-cancel" class="btn secondary-button fa-v2-button fa-v2-button--secondary" href="timeline.html">Annulla</a>
        <button id="memory-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Salva album</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="attachment-preview.js"></script>
  <script src="deadline-attachments.js"></script>
  <script src="ricordo.js"></script>
</body>
</html>
