<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo contatto - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="contact-editor-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card contact-editor-page fa-page">
    <p class="contact-back-link"><a href="contatti.html">Torna ai contatti</a></p>
    <header class="contact-editor-header">
      <span class="fa-icon-badge contact-editor-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2M17 10h4M19 8v4"/></svg></span>
      <div><p class="eyebrow">Rubrica personale</p><h1>Nuovo contatto</h1><p>Aggiungi una persona alla tua rubrica privata.</p></div>
    </header>
    <p id="message" aria-live="polite"></p>
    <form id="contact-form" class="contact-create-form fa-surface">
      <div class="contact-form-grid">
        <div><label for="first-name">Nome *</label><input id="first-name" type="text" required autocomplete="given-name"></div>
        <div><label for="last-name">Cognome</label><input id="last-name" type="text" autocomplete="family-name"></div>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
        <div><label for="phone">Cellulare</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel"></div>
        <div><label for="birth-date">Data di nascita</label><input id="birth-date" type="date"></div>
      </div>
      <p id="partial-save-message" class="form-feedback" hidden aria-live="polite"></p>
      <p><a id="open-contact-link" hidden>Apri la scheda del contatto</a></p>
      <div class="form-actions"><button id="save-button" type="submit">Crea contatto</button><a class="btn secondary-button" href="contatti.html">Annulla</a></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="nuovo-contatto.js"></script>
</body>
</html>
