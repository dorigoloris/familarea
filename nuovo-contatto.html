<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Nuovo contatto - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card fa-page fa-page--wide fa-v2-page fa-v2-page-stack">
    <p class="account-back-link"><a href="contatti.html">Torna ai Contatti</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card">
      <div class="fa-section-hero-content"><p class="eyebrow">RUBRICA CONTATTI</p><h1>Nuovo contatto</h1><p>Aggiungi un nuovo contatto alla rubrica.</p></div>
    </header>
    <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
    <form id="contact-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack">
      <div class="fa-v2-page-stack">
        <label for="first-name">Nome *<input id="first-name" class="fa-v2-input" type="text" required autocomplete="given-name"></label>
        <label for="last-name">Cognome<input id="last-name" class="fa-v2-input" type="text" autocomplete="family-name"></label>
        <label for="email">Email<input id="email" class="fa-v2-input" type="email" autocomplete="email"></label>
        <label for="phone">Cellulare<input id="phone" class="fa-v2-input" type="tel" inputmode="tel" autocomplete="tel"></label>
        <label for="birth-date">Data di nascita<input id="birth-date" class="fa-v2-input" type="date"></label>
      </div>
      <div class="fa-v2-card-actions"><button id="save-button" class="fa-v2-button fa-v2-button--primary" type="submit">Salva contatto</button><a class="fa-v2-button fa-v2-button--secondary" href="contatti.html">Annulla</a></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="nuovo-contatto.js"></script>
</body>
</html>
