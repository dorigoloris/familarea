<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documenti personali - Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page fa-v2-page fa-v2-page-stack deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a href="scadenze.html">Torna alle Scadenze</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="personal-documents-title">
      <div class="fa-section-hero-content">
        <div class="fa-section-hero-title-row">
          <h1 id="personal-documents-title">Documenti personali</h1>
          <a id="document-create" class="fa-v2-button fa-v2-button--primary" href="gestione-documento.html">+ Aggiungi documento</a>
        </div>
        <p>Conserva le informazioni essenziali e ricevi un promemoria alla scadenza.</p>
      </div>
    </header>
    <div id="managed-context" hidden></div>
    <p id="documents-message" class="deadline-management-message fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
    <section id="documents-empty" class="fa-v2-section-card fa-v2-empty-state fa-v2-card deadline-management-empty" hidden><strong>Nessun documento.</strong><span>Aggiungi il primo documento personale da organizzare.</span></section>
    <section id="documents-list" class="fa-v2-section-card fa-v2-section-card--list fa-v2-list-surface fa-v2-list fa-v2-card fa-v2-card-grid--two" aria-label="Documenti personali"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="managed-context.js"></script>
  <script src="date-utils.js"></script>
  <script src="attachment-preview.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="gestione-scadenze-documenti.js"></script>
</body>
</html>
