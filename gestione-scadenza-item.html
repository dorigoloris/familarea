<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veicolo - Gestione Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a href="gestione-scadenze-veicoli.html">Torna ai Veicoli</a></p>
    <p id="deadline-item-message" class="deadline-management-message" aria-live="polite">Caricamento veicolo...</p>
    <div id="deadline-item-content" hidden>
      <header class="fa-section-hero" aria-labelledby="deadline-item-title">
        <div class="fa-section-hero-content deadline-item-hero-content"><span id="deadline-item-image" class="deadline-management-item-image deadline-management-item-image--hero" aria-label="Foto veicolo">V</span><div><p class="eyebrow">VEICOLO</p><h1 id="deadline-item-title"></h1><p id="deadline-item-type"></p></div></div>
      </header>
      <section class="deadline-item-deadlines fa-surface" aria-labelledby="deadline-item-deadlines-title">
        <h2 id="deadline-item-deadlines-title">Scadenze</h2>
        <div id="deadline-item-predefined-cards" class="fa-item-card-grid" aria-label="Tipologie di scadenza del veicolo"></div>
        <section id="deadline-item-custom-deadlines" hidden aria-labelledby="deadline-item-custom-deadlines-title">
          <h3 id="deadline-item-custom-deadlines-title">Altre scadenze</h3>
          <div id="deadline-item-deadlines-list" class="deadline-management-list" aria-label="Altre scadenze del veicolo"></div>
        </section>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="date-utils.js"></script>
  <script src="deadline-item-image.js"></script>
  <script src="gestione-scadenza-item.js"></script>
</body>
</html>
