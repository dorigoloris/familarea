<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemento - Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view">
  <script>if (new URLSearchParams(window.location.search).get('context') === 'home') document.body.classList.add('fa-v2-app', 'home-deadline-item');</script>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a href="scadenze.html">Torna alle Scadenze</a></p>
    <p id="deadline-item-message" class="deadline-management-message" aria-live="polite">Caricamento elemento...</p>
    <div id="deadline-item-content" hidden>
      <h1 id="deadline-item-page-title" class="fa-visually-hidden"></h1>
      <header class="deadline-item-summary-card deadline-item-hero" aria-labelledby="deadline-item-page-title">
        <span id="deadline-item-image" class="deadline-management-item-image deadline-item-summary-image" aria-label="Foto elemento">E</span><p id="deadline-item-type" class="deadline-item-summary-type"></p><h2 id="deadline-item-title" class="deadline-item-summary-name"></h2><span id="deadline-item-plate" class="deadline-item-summary-plate"></span><button id="deadline-item-create" class="fa-button fa-button-secondary fa-button-compact deadline-item-summary-action" type="button">+ Aggiungi scadenza</button>
      </header>
      <section class="deadline-item-deadlines fa-surface" aria-labelledby="deadline-item-deadlines-title">
        <h2 id="deadline-item-deadlines-title">Scadenze</h2>
        <div id="deadline-item-predefined-cards" class="deadline-management-list fa-v2-list" aria-label="Tipologie di scadenza dell'elemento"></div>
        <section id="deadline-item-custom-deadlines" hidden aria-labelledby="deadline-item-custom-deadlines-title">
          <h3 id="deadline-item-custom-deadlines-title">Altre scadenze</h3>
          <div id="deadline-item-deadlines-list" class="deadline-management-list" aria-label="Altre scadenze dell'elemento"></div>
        </section>
      </section>
      <section id="home-annual-calendar" class="fa-v2-section-card fa-v2-card annual-deadline-calendar" aria-labelledby="home-annual-calendar-title" hidden>
        <div class="annual-deadline-calendar-heading">
          <div>
            <h2 id="home-annual-calendar-title">Calendario scadenze Casa</h2>
            <p>Una panoramica annuale delle scadenze previste per la tua casa.</p>
          </div>
          <div class="annual-deadline-calendar-controls" aria-label="Navigazione anno">
            <button id="home-calendar-previous-year" class="fa-v2-button fa-v2-button--secondary" type="button" aria-label="Anno precedente">←</button>
            <strong id="home-calendar-year" aria-live="polite"></strong>
            <button id="home-calendar-next-year" class="fa-v2-button fa-v2-button--secondary" type="button" aria-label="Anno successivo">→</button>
          </div>
        </div>
        <p id="home-calendar-message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
        <div id="home-annual-calendar-grid" class="annual-deadline-calendar-grid" aria-label="Calendario annuale delle scadenze Casa"></div>
      </section>
    </div>
  </main>
  <div id="deadline-item-edit-modal" class="confirm-modal-overlay deadline-item-edit-modal" hidden>
    <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deadline-item-edit-title">
      <button id="deadline-item-edit-close" class="confirm-modal-close" type="button" aria-label="Chiudi modifica">&times;</button>
      <h2 id="deadline-item-edit-title" class="confirm-modal-title">Modifica elemento</h2>
      <div class="deadline-management-item-image-field deadline-item-image-editor" aria-labelledby="deadline-item-image-label">
        <label id="deadline-item-image-label" for="deadline-item-image-input">Foto dell’elemento</label>
        <div class="deadline-management-item-image-actions"><span id="deadline-item-image-preview" class="deadline-management-item-image" aria-label="Anteprima foto">E</span><div><input id="deadline-item-image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><label id="deadline-item-image-upload" class="fa-button fa-button-secondary fa-button-compact" for="deadline-item-image-input">Carica foto</label><button id="deadline-item-image-remove" class="fa-button fa-button-secondary fa-button-compact" type="button" hidden>Rimuovi foto</button><button id="deadline-item-image-save" class="fa-button fa-button-primary fa-button-compact" type="button">Salva foto</button><p id="deadline-item-image-message" class="deadline-management-item-image-message" aria-live="polite"></p></div></div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="date-utils.js"></script>
  <script src="attachment-preview.js"></script>
  <script src="deadline-item-image.js"></script>
  <script src="annual-deadline-calendar.js"></script>
  <script src="gestione-scadenza-item.js"></script>
</body>
</html>
