<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veicolo - Gestione Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a href="gestione-scadenze-veicoli.html">Torna ai Veicoli</a></p>
    <p id="deadline-item-message" class="deadline-management-message" aria-live="polite">Caricamento veicolo...</p>
    <section id="deadline-item-content" hidden>
      <header class="fa-section-hero" aria-labelledby="deadline-item-title">
        <div class="fa-section-hero-content"><p class="eyebrow">VEICOLO</p><h1 id="deadline-item-title"></h1><p id="deadline-item-type"></p></div>
      </header>
      <section class="deadline-item-deadlines fa-surface" aria-labelledby="deadline-item-deadlines-title">
        <h2 id="deadline-item-deadlines-title">Scadenze</h2>
        <p id="deadline-item-deadlines-empty">Caricamento scadenze...</p>
        <div id="deadline-item-deadlines-list" class="deadline-management-list" hidden aria-label="Scadenze del veicolo"></div>
        <p class="deadline-item-deadlines-actions"><a id="deadline-item-add-deadline" class="fa-button fa-button-primary" href="nuova-scadenza.html">+ Aggiungi scadenza</a></p>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="date-utils.js"></script>
  <script src="gestione-scadenza-item.js"></script>
</body>
</html>
