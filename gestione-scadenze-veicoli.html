<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veicoli - Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page fa-v2-page fa-v2-page-stack deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a href="scadenze.html">Torna alle Scadenze</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="vehicles-title">
      <div class="fa-section-hero-content">
        <div class="fa-section-hero-title-row">
          <h1 id="vehicles-title">Veicoli</h1>
          <button id="vehicle-create" class="fa-v2-button fa-v2-button--primary" type="button">+ Aggiungi veicolo</button>
        </div>
        <p>Prepara gli elementi a cui potrai collegare bollo, RCA, revisione e manutenzioni.</p>
      </div>
    </header>

    <p id="vehicles-message" class="deadline-management-message fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
    <section id="vehicles-empty" class="fa-v2-section-card fa-v2-empty-state fa-v2-card deadline-management-empty" hidden><strong>Nessun veicolo.</strong><span>Aggiungi il primo veicolo da organizzare.</span></section>
    <section id="vehicles-list" class="fa-v2-section-card fa-v2-section-card--list fa-v2-list-surface fa-v2-list fa-v2-card fa-v2-card-grid--two" aria-label="Veicoli"></section>
    <section class="fa-v2-section-card fa-v2-card annual-deadline-calendar" aria-labelledby="vehicle-annual-calendar-title">
      <div class="annual-deadline-calendar-heading">
        <div>
          <h2 id="vehicle-annual-calendar-title">Calendario scadenze veicoli</h2>
          <p>Una panoramica annuale delle scadenze previste per i tuoi veicoli.</p>
        </div>
        <div class="annual-deadline-calendar-controls" aria-label="Navigazione anno">
          <button id="vehicle-calendar-previous-year" class="fa-v2-button fa-v2-button--secondary" type="button" aria-label="Anno precedente">←</button>
          <strong id="vehicle-calendar-year" aria-live="polite"></strong>
          <button id="vehicle-calendar-next-year" class="fa-v2-button fa-v2-button--secondary" type="button" aria-label="Anno successivo">→</button>
        </div>
      </div>
      <p id="vehicle-calendar-message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
      <div id="vehicle-annual-calendar-grid" class="annual-deadline-calendar-grid" aria-label="Calendario annuale delle scadenze veicoli"></div>
    </section>
  </main>
  <div id="vehicle-form-modal" class="confirm-modal-overlay deadline-management-vehicle-modal" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="vehicle-form-title" tabindex="-1">
      <button id="vehicle-modal-close" class="confirm-modal-close" type="button" aria-label="Chiudi">×</button>
      <form id="vehicle-form" class="deadline-management-form">
        <h2 id="vehicle-form-title">Aggiungi veicolo</h2>
        <p id="vehicle-form-message" class="deadline-management-message" aria-live="polite"></p>
        <div class="deadline-management-form-grid">
          <div><label for="vehicle-name">Nome *</label><input id="vehicle-name" type="text" required placeholder="Es. Fiat 500"></div>
          <div><label for="vehicle-type">Tipo *</label><select id="vehicle-type" required><option value="car">Auto</option><option value="motorcycle">Moto</option><option value="other">Altro</option></select></div>
          <div><label for="vehicle-plate">Targa</label><input id="vehicle-plate" type="text" placeholder="Es. GB123CD"></div>
        </div>
        <div class="deadline-management-item-image-field"><label>Foto del veicolo</label><div class="deadline-management-item-image-actions"><span id="vehicle-image-preview" class="deadline-management-item-image" aria-label="Anteprima foto veicolo">V</span><div><input id="vehicle-image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><label id="vehicle-image-upload" class="fa-button fa-button-secondary fa-button-compact" for="vehicle-image-input">Carica foto</label><button id="vehicle-image-remove" class="fa-button fa-button-secondary fa-button-compact" type="button" hidden>Rimuovi foto</button><p id="vehicle-image-message" class="deadline-management-item-image-message" aria-live="polite"></p></div></div></div>
        <div class="form-actions vehicle-form-actions"><button id="vehicle-delete" class="fa-button fa-button-danger" type="button" hidden>Elimina veicolo</button><div><button id="vehicle-cancel" class="fa-button fa-button-secondary" type="button">Annulla</button><button id="vehicle-save" class="fa-button fa-button-primary" type="submit">Aggiungi veicolo</button></div></div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="deadline-item-image.js"></script>
  <script src="annual-deadline-calendar.js"></script>
  <script src="gestione-scadenze-veicoli.js"></script>
</body>
</html>
