<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veicoli - Gestione Scadenze - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-section-page deadline-management-page">
    <p class="account-back-link"><a href="gestione-scadenze.html">Torna a Gestione Scadenze</a></p>
    <header class="fa-section-hero" aria-labelledby="vehicles-title">
      <div class="fa-section-hero-content">
        <p class="eyebrow">GESTIONE SCADENZE</p>
        <div class="fa-section-hero-title-row">
          <h1 id="vehicles-title">Veicoli</h1>
          <button id="vehicle-create" class="fa-button fa-button-primary" type="button">+ Aggiungi veicolo</button>
        </div>
        <p>Prepara gli elementi a cui potrai collegare bollo, RCA, revisione e manutenzioni.</p>
      </div>
    </header>

    <p id="vehicles-message" class="deadline-management-message" aria-live="polite"></p>
    <form id="vehicle-form" class="deadline-management-form fa-surface" hidden>
      <h2 id="vehicle-form-title">Nuovo veicolo</h2>
      <div class="deadline-management-form-grid">
        <div><label for="vehicle-name">Nome *</label><input id="vehicle-name" type="text" required placeholder="Es. Fiat 500"></div>
        <div><label for="vehicle-type">Tipo *</label><select id="vehicle-type" required><option value="car">Auto</option><option value="motorcycle">Moto</option><option value="other">Altro</option></select></div>
      </div>
      <div class="form-actions"><button class="fa-button fa-button-primary" type="submit">Salva veicolo</button><button id="vehicle-cancel" class="fa-button fa-button-secondary" type="button">Annulla</button></div>
    </form>

    <section id="vehicles-empty" class="fa-empty-state deadline-management-empty" hidden><strong>Nessun veicolo.</strong><span>Aggiungi il primo veicolo da organizzare.</span></section>
    <section id="vehicles-list" class="deadline-management-list" aria-label="Veicoli"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="gestione-scadenze-veicoli.js"></script>
</body>
</html>
