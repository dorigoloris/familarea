<!DOCTYPE html>
<html lang="it"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuova password - FamilArea</title><link rel="stylesheet" href="app.css">
</head><body><main class="page-card">
  <h1>Imposta una nuova password</h1>
  <p id="message" aria-live="polite">Verifica del link in corso...</p>
  <form id="new-password-form" hidden>
    <div><label for="password">Nuova password</label><input id="password" type="password" autocomplete="new-password" required></div><br>
    <div><label for="password-confirmation">Conferma nuova password</label><input id="password-confirmation" type="password" autocomplete="new-password" required></div><br>
    <button type="submit">Salva nuova password</button>
  </form>
  <p><a href="login.html">Torna ad Accedi</a></p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-public-config.js"></script><script src="nuova-password.js"></script></body></html>
