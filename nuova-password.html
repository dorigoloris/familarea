<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FamilArea">
  <meta name="theme-color" content="#0d2b4f">
  <title>Nuova password - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <main class="fa-v2-page fa-v2-page-stack">
    <a class="fa-v2-button fa-v2-button--secondary" href="index.html">FamilArea</a>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="new-password-title"><div class="fa-section-hero-content"><p class="eyebrow">SICUREZZA</p><h1 id="new-password-title">Imposta una nuova password</h1><p>Scegli una password sicura per il tuo account FamilArea.</p></div></header>
    <p id="message" class="fa-v2-status" aria-live="polite">Verifica del link in corso...</p>
    <form id="new-password-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack" hidden><div><label for="password">Nuova password</label><input id="password" class="fa-v2-input" type="password" autocomplete="new-password" minlength="8" required><p class="field-help">Usa almeno 8 caratteri.</p></div><div><label for="password-confirmation">Conferma nuova password</label><input id="password-confirmation" class="fa-v2-input" type="password" autocomplete="new-password" minlength="8" required></div><div class="fa-v2-card-actions"><a id="new-password-login-link" class="fa-v2-button fa-v2-button--secondary" href="login.html">Torna ad Accedi</a><button id="new-password-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Salva nuova password</button></div></form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="auth-utils.js"></script>
  <script src="nuova-password.js"></script>
</body>
</html>
