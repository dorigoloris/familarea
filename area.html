<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="area-page">
    <div class="area-page-decoration area-page-decoration-one" aria-hidden="true"></div>
    <div class="area-page-decoration area-page-decoration-two" aria-hidden="true"></div>
    <header class="area-page-header" aria-labelledby="area-name">
      <div class="area-page-heading">
        <div class="area-page-heading-meta">
          <p id="area-type-label" class="area-type-label">Area</p>
          <span id="area-role-badge" class="area-role-badge" hidden></span>
        </div>
        <h1 id="area-name">Area FamilArea</h1>
      </div>

      <div id="area-illustration" class="area-header-illustration" aria-hidden="true"></div>

      <div id="area-manage-menu" class="area-manage-menu" hidden>
        <button id="area-manage-trigger" class="area-manage-trigger" type="button" aria-haspopup="dialog" aria-controls="area-manage-modal" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM19.4 15a1.8 1.8 0 0 0 .36 1.98l.05.05-2.1 2.1-.05-.05a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.1 1.65v.08h-3v-.08a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-1.98.36l-.05.05-2.1-2.1.05-.05A1.8 1.8 0 0 0 6.74 15a1.8 1.8 0 0 0-1.65-1.1H5v-3h.09a1.8 1.8 0 0 0 1.65-1.1 1.8 1.8 0 0 0-.36-1.98l-.05-.05 2.1-2.1.05.05a1.8 1.8 0 0 0 1.98.36 1.8 1.8 0 0 0 1.1-1.65V4.35h3v.08a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 1.98-.36l.05-.05 2.1 2.1-.05.05a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.1H20v3h-.08A1.8 1.8 0 0 0 18.27 15Z"/></svg>
          Gestisci
          <svg class="area-manage-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
      </div>
    </header>

    <div id="area-manage-modal" class="area-manage-modal" hidden>
      <section id="area-manage-dialog" class="area-manage-dialog" role="dialog" aria-modal="true" aria-labelledby="area-manage-title" tabindex="-1">
        <button id="area-manage-close" class="area-manage-close" type="button" aria-label="Chiudi gestione Area">×</button>
        <h2 id="area-manage-title">Gestisci Area</h2>
        <p>Modifica le informazioni dell'Area</p>
        <div id="area-manage-actions" class="area-manage-actions">
          <a id="edit-area-link" class="area-manage-action" href="#" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20ZM13.5 7.5l3 3"/></svg><span>Modifica Area</span></a>
        </div>
      </section>
    </div>

    <p id="message" class="area-page-message" aria-live="polite">Caricamento...</p>

    <div class="area-overview-grid">
      <section class="area-overview-card area-participants-card" aria-labelledby="participants-title">
        <div class="area-card-heading">
          <div class="area-card-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 8a3 3 0 1 1 0 6M22 20v-1.5a4 4 0 0 0-3-3.8"/></svg><h2 id="participants-title">Partecipanti</h2></div>
          <div class="area-card-heading-actions">
            <a id="invite-participants-link" class="area-participants-invite" href="#" hidden>Invita partecipanti</a>
            <span id="participants-count" class="area-count-badge">0</span>
          </div>
        </div>
        <ul id="members-list" class="area-compact-list"></ul>
        <button id="members-toggle" class="area-card-link-button" type="button" hidden aria-expanded="false">Mostra tutti i partecipanti</button>
      </section>

      <section id="activities-section" class="area-overview-card area-activities-card" aria-labelledby="activities-title" hidden>
        <div class="area-card-heading">
          <div class="area-card-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6M3 4h18v16H3z"/></svg><h2 id="activities-title">Attivit&agrave;</h2></div>
          <span id="activities-count" class="area-count-badge">0</span>
        </div>
        <div id="activities-preview" class="area-compact-list" aria-live="polite"></div>
        <p id="activities-message" class="area-card-message"></p>
        <a id="activities-link" class="area-card-link" href="#">Vedi attivit&agrave;</a>
      </section>

      <section id="events-section" class="area-overview-card area-events-card" aria-labelledby="events-title" hidden>
        <div class="area-card-heading">
          <div class="area-card-title"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/></svg><h2 id="events-title">Eventi</h2></div>
          <span id="events-count" class="area-count-badge">0</span>
        </div>
        <div id="events-preview" class="area-compact-list" aria-live="polite"></div>
        <p id="events-message" class="area-card-message"></p>
        <a id="events-link" class="area-card-link" href="#">Vedi eventi</a>
      </section>

      <section id="lists-section" class="area-overview-card area-lists-card" aria-labelledby="lists-title" hidden>
        <div class="area-card-heading">
          <div class="area-card-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><h2 id="lists-title">Liste</h2></div>
          <span id="lists-count" class="area-count-badge">0</span>
        </div>
        <div id="lists-preview" class="area-compact-list" aria-live="polite"></div>
        <p id="lists-message" class="area-card-message"></p>
        <a id="lists-link" class="area-card-link" href="#">Vedi liste</a>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="area.js"></script>
  <script src="area-edit-link.js"></script>
</body>
</html>
