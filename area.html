<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>

  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <div class="area-heading"><h1 id="area-name">Area FamilArea</h1><a id="edit-area-link" class="btn" href="#" hidden>Modifica Area</a></div>

  <p id="message">Caricamento...</p>

  <h2>Partecipanti</h2>

  <ul id="members-list"></ul>

  <p><a id="add-member-link" href="#" hidden>Invita partecipante</a></p>
  <p><a id="area-invites-link" href="#" hidden>Gestisci inviti</a></p>

  <section id="activities-section" hidden>
    <h2>Attivit&agrave;</h2>
    <p id="activities-message"></p>
    <ul id="activities-list"></ul>
    <p><a id="new-activity-link" href="#">+ Nuova attivit&agrave;</a></p>
  </section>

  <section>
    <h2>Eventi</h2>
    <p><a id="events-link" href="#">Vedi tutti gli eventi</a></p>
    <p><a id="new-event-link" href="#">+ Nuovo evento</a></p>
  </section>

  <section id="lists-section" hidden>
    <h2>Liste</h2>
    <p id="lists-message"></p>
    <ul id="lists-preview"></ul>
    <p><a id="lists-link" href="#">Vedi tutte le liste</a></p>
    <p><a id="new-list-link" href="#">+ Nuova lista</a></p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="area.js"></script>
  <script src="area-edit-link.js"></script>

</body>
</html>
