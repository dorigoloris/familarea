<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambia password - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a href="impostazioni.html">Torna alle impostazioni</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="change-password-title">
      <div class="fa-section-hero-content">
        <p class="eyebrow">SICUREZZA</p>
        <h1 id="change-password-title">Cambia password</h1>
        <p>Scegli una nuova password per il tuo account FamilArea.</p>
      </div>
    </header>
    <p id="password-message" class="preferences-message fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
    <form id="change-password-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack" hidden>
      <div>
        <label for="new-password">Nuova password</label>
        <input id="new-password" class="fa-v2-input" type="password" autocomplete="new-password" minlength="8" required>
        <p class="field-help">Usa almeno 8 caratteri.</p>
      </div>
      <div>
        <label for="new-password-confirmation">Conferma nuova password</label>
        <input id="new-password-confirmation" class="fa-v2-input" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="fa-v2-card-actions"><button id="change-password-button" class="fa-v2-button fa-v2-button--primary" type="submit">Salva nuova password</button></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="cambia-password.js"></script>
</body>
</html>
