<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambia password - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card password-change-page">
    <h1>Cambia password</h1>
    <p>Scegli una nuova password per il tuo account FamilArea.</p>
    <p id="password-message" class="preferences-message" aria-live="polite"></p>
    <form id="change-password-form" hidden>
      <div>
        <label for="new-password">Nuova password</label><br>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="field-help">Usa almeno 8 caratteri.</p>
      </div>
      <div>
        <label for="new-password-confirmation">Conferma nuova password</label><br>
        <input id="new-password-confirmation" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-actions"><button id="change-password-button" type="submit">Salva nuova password</button></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="cambia-password.js"></script>
</body>
</html>
