<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le mie impostazioni - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="account-page preferences-page-body">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card account-page-shell preferences-page">
    <header class="account-page-heading">
      <span class="account-heading-icon account-heading-icon-settings" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H5.3v-3h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3h-.2a1.7 1.7 0 0 0-1.5 1Z"></path></svg></span>
      <div><h1>Le mie impostazioni</h1><p>Personalizza il funzionamento di FamilArea.</p></div>
    </header>
    <section class="settings-card" aria-labelledby="preferences-title">
    <h2 id="preferences-title">Preferenze</h2>
    <p id="preferences-message" class="preferences-message" aria-live="polite">Caricamento impostazioni...</p>
    <form id="preferences-form" hidden>
      <div><label for="preference-language">Lingua</label><br><select id="preference-language"><option value="it">Italiano</option></select></div>
      <div><label for="preference-date-format">Formato data</label><br><select id="preference-date-format"><option value="DD/MM/YYYY">31/12/2026</option><option value="YYYY-MM-DD">2026-12-31</option><option value="MM/DD/YYYY">12/31/2026</option></select></div>
      <div><label for="preference-week-start">Primo giorno della settimana</label><br><select id="preference-week-start"><option value="1">Lunedì</option><option value="0">Domenica</option><option value="2">Martedì</option><option value="3">Mercoledì</option><option value="4">Giovedì</option><option value="5">Venerdì</option><option value="6">Sabato</option></select></div>
      <div class="form-actions"><button id="preferences-save-button" type="submit">Salva impostazioni</button></div>
    </form>
    </section>
    <section class="settings-card security-settings-card" aria-labelledby="security-title">
      <h2 id="security-title">Sicurezza</h2>
      <p>Gestisci la sicurezza del tuo account.</p>
      <a class="secondary-button" href="cambia-password.html">Cambia password</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="impostazioni.js"></script>
</body>
</html>
