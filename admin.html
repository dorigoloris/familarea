<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Amministrazione - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <header class="fa-v2-header-card fa-v2-card">
      <div class="fa-section-hero-content">
        <p class="eyebrow">AMMINISTRAZIONE DI SISTEMA</p>
        <div class="fa-section-hero-title-row"><h1>Admin</h1></div>
        <p>Panoramica read-only degli account e delle dipendenze FamilArea.</p>
      </div>
    </header>

    <p id="admin-message" class="fa-v2-status" aria-live="polite">Verifica autorizzazione…</p>

    <div id="admin-content" class="fa-v2-page-stack" hidden>
      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="admin-dashboard-title">
        <div class="fa-v2-section-heading"><div><p class="eyebrow">PANORAMICA</p><h2 id="admin-dashboard-title">Dati FamilArea</h2></div></div>
        <div id="admin-metrics" class="fa-v2-metric-grid" aria-live="polite"></div>
      </section>

      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="admin-accounts-title">
        <div class="fa-v2-section-heading fa-v2-content-action-row">
          <div><p class="eyebrow">UTENTI</p><h2 id="admin-accounts-title">Account</h2></div>
          <form id="admin-search-form" class="fa-v2-content-action-row">
            <div>
              <label class="sr-only" for="admin-search">Cerca utente</label>
              <input id="admin-search" class="fa-v2-input" type="search" autocomplete="off" placeholder="Cerca nome, email o organizzazione">
            </div>
            <button class="fa-v2-button fa-v2-button--secondary" type="submit">Cerca</button>
          </form>
        </div>
        <p id="admin-accounts-summary" class="fa-v2-status"></p>
        <div id="admin-accounts-list" class="fa-v2-list"></div>
      </section>

      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="admin-interests-title">
        <div class="fa-v2-section-heading"><div><p class="eyebrow">CATALOGO</p><h2 id="admin-interests-title">Interessi e categorie</h2></div></div>
        <div class="fa-v2-page-stack">
          <section class="fa-v2-page-stack"><h3>Categorie</h3><div id="admin-interest-categories" class="fa-v2-list"></div></section>
          <section class="fa-v2-page-stack"><h3>Interessi</h3><div id="admin-interests-list" class="fa-v2-list"></div></section>
          <section class="fa-v2-page-stack"><h3>Proposte categorie</h3><div id="admin-interest-proposals" class="fa-v2-list"></div></section>
        </div>
      </section>

      <section id="admin-account-detail" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="admin-account-detail-title" hidden>
        <div class="fa-v2-section-heading fa-v2-content-action-row">
          <div><p class="eyebrow">DIAGNOSTICA DIPENDENZE</p><h2 id="admin-account-detail-title">Dettaglio utente</h2></div>
          <button id="admin-detail-close" class="fa-v2-button fa-v2-button--secondary" type="button">Chiudi dettaglio</button>
        </div>
        <div id="admin-account-summary" class="fa-v2-list"></div>
        <section id="admin-account-editor" class="fa-v2-page-stack" hidden></section>
        <section id="admin-account-delete" class="fa-v2-notice fa-v2-notice--danger fa-v2-page-stack" hidden></section>
        <div id="admin-account-dependencies" class="fa-v2-list"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="admin.js"></script>
</body>
</html>
