<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Scheda contatto - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card fa-page fa-page--wide fa-v2-page fa-v2-page-stack">
    <p class="account-back-link"><a href="contatti.html">Torna ai Contatti</a></p>
    <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento contatto...</p>

    <div id="contact-view" class="fa-v2-page-stack" hidden>
      <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="contact-name">
        <div class="fa-section-hero-content">
          <p class="eyebrow">CONTATTO</p>
          <div class="fa-section-hero-title-row">
            <h1 id="contact-name">Contatto</h1>
            <div class="fa-v2-card-actions"><button id="edit-button" class="fa-v2-button fa-v2-button--secondary" type="button">Modifica</button><button id="delete-button" class="fa-v2-button fa-v2-button--danger" type="button">Elimina contatto</button></div>
          </div>
          <p id="contact-birth-date" hidden></p>
        </div>
      </header>

      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="email-heading">
        <div class="fa-v2-section-heading"><h2 id="email-heading">Email</h2></div>
        <div id="email-list" class="fa-v2-list" aria-label="Email"></div>
      </section>

      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="phone-heading">
        <div class="fa-v2-section-heading"><h2 id="phone-heading">Cellulari</h2></div>
        <div id="phone-list" class="fa-v2-list" aria-label="Cellulari"></div>
      </section>

      <section id="contact-invite-section" class="fa-v2-notice fa-v2-notice--info fa-v2-page-stack" hidden>
        <div class="fa-v2-section-heading">
          <h2 id="contact-invite-title">Invita in FamilArea</h2>
          <p id="contact-invite-description"></p>
        </div>
        <div class="fa-v2-card-actions">
          <button id="send-contact-invite-button" type="button" class="fa-v2-button fa-v2-button--primary">Invia invito</button>
          <div id="contact-invite-feedback" class="fa-v2-status" hidden aria-live="polite">
            <strong id="contact-invite-status"></strong>
            <p id="contact-invite-message"></p>
          </div>
        </div>
      </section>
    </div>

    <form id="edit-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack" hidden>
      <div class="fa-v2-section-heading"><p class="eyebrow">RUBRICA CONTATTI</p><h2>Modifica contatto</h2></div>
      <div class="fa-v2-page-stack">
        <label for="edit-first-name">Nome *<input id="edit-first-name" class="fa-v2-input" type="text" required autocomplete="given-name"></label>
        <label for="edit-last-name">Cognome<input id="edit-last-name" class="fa-v2-input" type="text" autocomplete="family-name"></label>
        <label for="edit-email">Email<input id="edit-email" class="fa-v2-input" type="email" autocomplete="email"></label>
        <label for="edit-phone">Cellulare<input id="edit-phone" class="fa-v2-input" type="tel" inputmode="tel" autocomplete="tel"></label>
        <label for="edit-birth-date">Data di nascita<input id="edit-birth-date" class="fa-v2-input" type="date"></label>
      </div>
      <div class="fa-v2-card-actions"><button id="edit-save-button" class="fa-v2-button fa-v2-button--primary" type="submit">Salva modifiche</button><button id="edit-cancel-button" class="fa-v2-button fa-v2-button--secondary" type="button">Annulla</button></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="contatto.js"></script>
</body>
</html>
