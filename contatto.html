<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheda contatto - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="contact-detail-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card contact-detail-page fa-page">
    <p class="contact-back-link"><a href="contatti.html">Torna ai contatti</a></p>
    <p id="message" aria-live="polite">Caricamento contatto...</p>

    <div id="contact-view" hidden>
      <header class="contact-detail-header fa-surface" aria-labelledby="contact-name">
        <div class="contact-detail-heading">
          <span class="fa-icon-badge contact-detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          <div><p class="eyebrow">Contatto personale</p><h1 id="contact-name">Contatto</h1><p id="contact-birth-date" class="contact-birth-date" hidden></p></div>
        </div>
        <div class="contact-actions"><button id="edit-button" type="button">Modifica</button><button id="delete-button" type="button" class="member-remove-button">Elimina contatto</button></div>
      </header>

      <div class="contact-methods-grid">
        <section class="contact-methods-section fa-surface">
          <div class="contact-methods-heading"><span class="fa-icon-badge contact-method-email-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 6 9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg></span><h2>Email</h2></div>
          <ul id="email-list" class="contact-method-list"></ul>
          <button id="add-email-button" type="button">Aggiungi email</button>
        </section>

        <section class="contact-methods-section fa-surface">
          <div class="contact-methods-heading"><span class="fa-icon-badge contact-method-phone-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h4l2 5-3 2c1.4 2.8 2.8 4.2 5.6 5.6l2-3 5 2v4c0 1.1-.9 2-2 2C10.4 20.2 3.8 13.6 3.8 5c0-1.1.9-2 2.2-2Z"/></svg></span><h2>Cellulari</h2></div>
          <ul id="phone-list" class="contact-method-list"></ul>
          <button id="add-phone-button" type="button">Aggiungi cellulare</button>
        </section>
      </div>

      <form id="method-form" class="contact-method-form fa-surface" hidden>
        <h3 id="method-form-title"></h3>
        <div><label for="method-value" id="method-value-label">Valore</label><input id="method-value" required></div>
        <div class="form-actions"><button id="method-save-button" type="submit">Salva</button><button id="method-cancel-button" type="button" class="secondary-button">Annulla</button></div>
      </form>
    </div>

    <form id="edit-form" class="contact-edit-form fa-surface" hidden>
      <p class="eyebrow">Rubrica personale</p><h1>Modifica contatto</h1>
      <div class="contact-form-grid">
        <div><label for="edit-first-name">Nome *</label><input id="edit-first-name" type="text" required autocomplete="given-name"></div>
        <div><label for="edit-last-name">Cognome</label><input id="edit-last-name" type="text" autocomplete="family-name"></div>
        <div><label for="edit-email">Email</label><input id="edit-email" type="email" autocomplete="email"></div>
        <div><label for="edit-phone">Cellulare</label><input id="edit-phone" type="tel" inputmode="tel" autocomplete="tel"></div>
        <div><label for="edit-birth-date">Data di nascita</label><input id="edit-birth-date" type="date"></div>
      </div>
      <div class="form-actions"><button id="edit-save-button" type="submit">Salva modifiche</button><button id="edit-cancel-button" type="button" class="secondary-button">Annulla</button></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="contatto.js"></script>
</body>
</html>
