<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei Inviti - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="personal-invites-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-section-page">
    <header class="fa-section-hero" aria-labelledby="personal-invites-title">
      <div class="fa-section-hero-content"><p class="eyebrow">AREE E FAMIGLIA</p><div class="fa-section-hero-title-row"><h1 id="personal-invites-title">I miei Inviti</h1></div><p>Qui trovi gli inviti ricevuti per partecipare alle Aree e alle Famiglie FamilArea.</p></div>
    </header>
    <p id="page-message" aria-live="polite">Caricamento inviti...</p>
    <section id="invites-section" class="personal-invites-surface fa-surface" hidden>
      <div id="invites-list" class="invites-list"></div>
      <p id="invites-empty" class="invites-empty-state fa-empty-state" hidden><span class="fa-icon-badge invites-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5 12 12l9-5.5M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1 1-1V6a1 1 0 0 1 1-1Z"/></svg></span><span><strong>Nessun invito o collegamento attivo.</strong><span>Quando qualcuno ti inviterà a un’Area o a una Famiglia, lo vedrai qui.</span></span></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="inviti.js"></script>
</body>
</html>
