<!DOCTYPE html>
<html lang="it">
<head>

  <link rel="stylesheet" href="app.css">
</head>
<body class="personal-invites-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card personal-invites-page fa-page">
    <div class="invites-page-decoration invites-page-decoration-one" aria-hidden="true"></div>
    <header class="invites-page-header" aria-labelledby="personal-invites-title">
      <div class="invites-page-heading"><p class="eyebrow">Partecipazione alle Aree</p><h1 id="personal-invites-title">I miei Inviti</h1><p>Qui trovi gli inviti ricevuti per partecipare alle Aree FamilArea.</p></div>
      <div class="invites-header-illustration" aria-hidden="true"><svg viewBox="0 0 270 176" focusable="false"><rect x="9" y="10" width="252" height="156" rx="31" fill="#e8f3f5"/><circle cx="211" cy="47" r="28" fill="#cce7d1"/><path d="M18 135c34-24 72-15 104-31 38-20 75-7 132 20v42H18Z" fill="#d9ecde"/><rect x="71" y="58" width="122" height="76" rx="15" fill="#fff" stroke="#0d2b4f" stroke-width="4"/><path d="m75 69 57 36 57-36" fill="none" stroke="#4d8b4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="196" cy="119" r="21" fill="#e5f2e2"/><path d="m186 119 7 7 14-16" fill="none" stroke="#4d8b4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <section id="invites-section" class="personal-invites-surface fa-surface" hidden>
      <div id="invites-list" class="invites-list"></div>
      <p id="invites-empty" class="invites-empty-state fa-empty-state" hidden><span class="fa-icon-badge invites-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5 12 12l9-5.5M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg></span><span><strong>Non hai inviti ricevuti.</strong><span>Quando qualcuno ti inviterà a un’Area, lo vedrai qui.</span></span></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
