<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a href="#">Torna alle liste</a></p>
    <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento lista...</p>
    <div id="list-view" class="fa-v2-page-stack" hidden>
      <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="list-title">
        <div class="fa-section-hero-content">
          <p class="section-kicker" id="area-name" hidden>Area</p>
          <div class="fa-v2-card-content">
            <div class="fa-section-hero-title-row"><h1 id="list-title">Lista</h1>
              <div id="list-actions" class="contact-actions" hidden>
                <button id="edit-list-button" class="fa-v2-button fa-v2-button--secondary" type="button">Modifica lista</button>
              </div>
            </div>
            <div id="list-sharing-summary" class="contact-directory-name" hidden>
              <strong id="list-sharing-status" class="fa-v2-status">Personale</strong>
              <div id="list-sharing-avatars" class="fa-v2-card-actions" aria-label="Persone con cui condividi questa lista"></div>
            </div>
          </div>
          <p id="list-description" class="list-description" hidden></p>
        </div>
      </header>
      <section id="list-management-panel" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="list-management-title" hidden>
        <div class="fa-v2-section-heading">
          <h2 id="list-management-title">Modifica lista</h2>
        </div>
        <form id="list-edit-form" class="fa-v2-page-stack">
          <p class="fa-v2-list-heading">Dati lista</p>
          <label for="list-edit-title">Nome lista</label>
          <input id="list-edit-title" class="fa-v2-input" required>
          <label for="list-edit-description">Descrizione</label>
          <textarea id="list-edit-description" class="fa-v2-textarea"></textarea>
          <div class="form-actions">
            <button id="save-list-button" class="fa-v2-button fa-v2-button--primary" type="button">Salva modifiche</button>
            <button id="cancel-list-edit-button" class="fa-v2-button fa-v2-button--secondary" type="button">Annulla</button>
          </div>
        </form>
        <div id="list-sharing-management" class="fa-v2-page-stack">
          <p class="fa-v2-list-heading">Condivisione</p>
          <p id="list-share-state" class="fa-v2-status"></p>
          <p id="list-share-message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
          <div class="fa-v2-page-stack">
            <label for="list-share-search">Cerca persona</label>
            <input id="list-share-search" class="fa-v2-input" type="search" placeholder="Cerca per nome o cognome" autocomplete="off">
            <p id="list-share-search-status" class="fa-v2-status" aria-live="polite"></p>
            <div id="list-share-search-results" class="fa-v2-list" aria-label="Risultati ricerca" hidden></div>
          </div>
          <div class="fa-v2-page-stack">
            <p class="fa-v2-list-heading">Inviti in attesa</p>
            <div id="list-share-pending" class="fa-v2-list" aria-label="Inviti in attesa" hidden></div>
            <p id="list-share-pending-empty" class="fa-v2-empty-state">Nessun invito in attesa.</p>
          </div>
          <div class="fa-v2-page-stack">
            <p class="fa-v2-list-heading">Partecipanti</p>
            <div id="list-share-participants" class="fa-v2-list" aria-label="Partecipanti" hidden></div>
            <p id="list-share-participants-empty" class="fa-v2-empty-state">Nessun partecipante.</p>
          </div>
        </div>
        <div class="fa-v2-page-stack">
          <p class="fa-v2-list-heading">Elimina lista</p>
          <div class="form-actions"><button id="delete-list-button" class="fa-v2-button fa-v2-button--danger" type="button">Elimina lista</button></div>
        </div>
      </section>
      <form id="add-item-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card">
        <label for="item-text">Aggiungi un elemento</label>
        <div class="list-add-item-controls"><input id="item-text" class="fa-v2-input" required><button id="add-item-button" class="fa-v2-button fa-v2-button--primary" type="submit">Aggiungi</button></div>
      </form>
      <section class="fa-v2-section-card fa-v2-section-card--list fa-v2-list-surface fa-v2-card" aria-labelledby="list-items-title">
        <div class="fa-v2-section-heading"><h2 id="list-items-title">Elementi</h2></div>
        <ul id="items-list" class="list-items fa-v2-list"></ul>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="unsaved-changes.js"></script>
  <script src="lista.js"></script>
</body>
</html>
