<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a href="#">Torna alle liste</a></p>
    <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento lista...</p>
    <div id="list-view" class="fa-v2-page-stack" hidden>
      <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="list-title">
        <div class="fa-section-hero-content">
          <p class="section-kicker" id="area-name">Area</p>
          <div class="fa-section-hero-title-row"><h1 id="list-title">Lista</h1>
        <div id="list-actions" class="contact-actions" hidden>
            <button id="edit-list-button" class="fa-v2-button fa-v2-button--secondary" type="button">Modifica lista</button>
            <button id="delete-list-button" class="fa-v2-button fa-v2-button--danger" type="button">Elimina lista</button>
          </div></div>
          <p id="list-description" class="list-description" hidden></p>
        </div>
      </header>
      <form id="add-item-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card">
        <label for="item-text">Aggiungi un elemento</label>
        <div class="list-add-item-controls"><input id="item-text" class="fa-v2-input" required><button id="add-item-button" class="fa-v2-button fa-v2-button--primary" type="submit">Aggiungi</button></div>
      </form>
      <section class="fa-v2-section-card fa-v2-section-card--list fa-v2-list-surface fa-v2-card" aria-labelledby="list-items-title">
        <div class="fa-v2-section-heading"><h2 id="list-items-title">Elementi</h2></div>
        <ul id="items-list" class="list-items fa-v2-list"></ul>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="lista.js"></script>
</body>
</html>
