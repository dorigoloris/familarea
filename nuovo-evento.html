<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo evento - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card">
    <p><a id="back-link" href="#">Torna agli eventi</a></p>
    <h1>Nuovo evento</h1>
    <p id="message" aria-live="polite">Caricamento...</p>
    <form id="event-form" hidden>
      <label for="title">Titolo</label><input id="title" required>
      <br><br>
      <label for="notes">Note</label><textarea id="notes"></textarea>
      <br><br>
      <div class="event-time-section" aria-labelledby="event-start-heading">
        <h2 id="event-start-heading" class="event-form-section-title">Inizio</h2>
        <div id="event-start-dates" class="event-dates event-start-dates">
          <div><label for="start-date">Data inizio</label><input id="start-date" type="date" required></div>
          <div id="start-time-field"><label for="start-time">Ora inizio</label><input id="start-time" type="time"></div>
        </div>
      </div>
      <div class="event-form-options">
        <label class="event-form-option"><input id="all-day" type="checkbox"><span>Tutto il giorno</span></label>
        <label class="event-form-option"><input id="multi-day" type="checkbox"><span>Più giorni</span></label>
      </div>
      <div id="event-end-section" class="event-time-section" aria-labelledby="event-end-heading">
        <h2 id="event-end-heading" class="event-form-section-title">Fine</h2>
        <div id="event-end-dates" class="event-dates event-end-dates">
          <div id="end-date-field" hidden><label for="end-date">Data fine</label><input id="end-date" type="date"></div>
          <div id="end-time-field"><label for="end-time">Ora fine</label><input id="end-time" type="time"></div>
        </div>
      </div>
      <div class="event-form-options">
        <label class="event-form-option"><input id="recurrence-enabled" type="checkbox"><span>Ripeti</span></label>
      </div>
      <div id="recurrence-fields" class="event-recurrence-fields" hidden>
        <div class="event-recurrence-interval">
          <label for="recurrence-interval">Ogni</label>
          <input id="recurrence-interval" type="number" min="1" max="32767" step="1" value="1">
          <span>settimana/e</span>
        </div>
        <fieldset class="event-recurrence-weekdays">
          <legend>Giorni</legend>
          <div class="event-recurrence-weekday-list">
            <label><input type="checkbox" name="recurrence-weekday" value="1"><span>Lun</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="2"><span>Mar</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="3"><span>Mer</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="4"><span>Gio</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="5"><span>Ven</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="6"><span>Sab</span></label>
            <label><input type="checkbox" name="recurrence-weekday" value="7"><span>Dom</span></label>
          </div>
        </fieldset>
        <fieldset class="event-recurrence-end-mode">
          <legend>Fine ripetizione</legend>
          <label><input type="radio" name="recurrence-end-mode" value="date" checked> Il</label>
          <input id="recurrence-until" type="date">
          <label><input type="radio" name="recurrence-end-mode" value="never"> Senza scadenza</label>
        </fieldset>
        <p id="recurrence-error" class="event-recurrence-error" role="alert" hidden></p>
      </div>
      <br><br>
      <label for="location">Luogo</label><input id="location">
      <br><br>
      <fieldset id="calendar-private-fieldset" class="event-family-visibility" hidden>
        <legend>Calendario condiviso</legend>
        <label><input id="calendar-private" type="checkbox"> Privato</label>
        <p class="event-family-visibility-note">L'evento resta visibile nel tuo Calendario, ma non viene incluso nel calendario che condividi.</p>
      </fieldset>
      <br id="calendar-private-spacing">
      <fieldset id="participants-fieldset"><legend>Partecipanti</legend><div id="participants"></div></fieldset>
      <br>
      <button type="submit">Crea evento</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="nuovo-evento.js"></script>
</body>
</html>
