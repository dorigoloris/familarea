<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuovo evento - FamilArea</title><link rel="stylesheet" href="app.css"></head><body>
<button class="logout-button" type="button" data-logout>Esci</button><p id="logout-message" aria-live="polite"></p><main class="page-card"><p><a id="back-link" href="#">Torna agli eventi</a></p><h1>Nuovo evento</h1><p id="message" aria-live="polite">Caricamento...</p><form id="event-form" hidden>
<label for="title">Titolo</label><input id="title" required><br><br><label for="notes">Note</label><textarea id="notes"></textarea><br><br><div class="event-dates"><div><label for="start-date">Data</label><input id="start-date" type="date" required></div><div><label for="start-time">Ora inizio</label><input id="start-time" type="time"></div><div><label for="end-time">Ora fine</label><input id="end-time" type="time"></div></div><br><label><input id="all-day" type="checkbox"> Tutto il giorno</label><br><br><label for="location">Luogo</label><input id="location"><br><br><fieldset><legend>Visibilità</legend><label><input type="radio" name="visibility" value="area" checked> Tutta l'Area</label><label><input type="radio" name="visibility" value="private"> Solo io</label><label><input type="radio" name="visibility" value="creator_participants"> Persone selezionate</label></fieldset><br><fieldset id="participants-fieldset"><legend>Partecipanti</legend><p id="participants-help">Facoltativi per gli eventi visibili a tutta l'Area.</p><div id="participants"></div></fieldset><br><button type="submit">Crea evento</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-public-config.js"></script><script src="logout.js"></script><script src="navigation.js"></script><script src="nuovo-evento.js"></script></body></html>
