<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheda membro - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>

  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <h1 id="member-name">Scheda membro</h1>

  <p id="message">Caricamento...</p>

  <div id="view-mode">
    <dl>
      <dt>Nome</dt>
      <dd id="member-first-name"></dd>

      <dt>Cognome</dt>
      <dd id="member-last-name"></dd>

      <dt>Data di nascita</dt>
      <dd id="member-birth-date"></dd>

      <dt>Ruolo nell'Area</dt>
      <dd id="member-role"></dd>
    </dl>

    <button type="button" id="edit-button" hidden>Modifica</button>

    <section id="contacts-section" hidden>
      <h2>Contatti</h2>
      <p id="contacts-message" aria-live="polite"></p>

      <h3>Email</h3>
      <ul id="email-contacts-list"></ul>
      <button type="button" id="add-email-button">Aggiungi email</button>

      <h3>Cellulari</h3>
      <ul id="phone-contacts-list"></ul>
      <button type="button" id="add-phone-button">Aggiungi cellulare</button>

      <form id="contact-form" hidden>
        <h3 id="contact-form-title"></h3>

        <div id="contact-email-field" hidden>
          <label for="contact-email-input">Email</label><br>
          <input type="email" id="contact-email-input" autocomplete="email">
        </div>

        <div id="contact-phone-field" hidden>
          <label for="contact-phone-input">Cellulare</label><br>
          <span aria-hidden="true">+39 </span><input type="tel" id="contact-phone-input" inputmode="tel" autocomplete="tel-national" placeholder="3331234567">
        </div>

        <br>

        <button type="submit" id="contact-save-button">Salva</button>
        <button type="button" id="contact-cancel-button">Annulla</button>
      </form>
    </section>
  </div>

  <form id="edit-form" hidden>
    <div>
      <label for="edit-first-name">Nome</label><br>
      <input type="text" id="edit-first-name" required>
    </div>

    <br>

    <div>
      <label for="edit-last-name">Cognome</label><br>
      <input type="text" id="edit-last-name">
    </div>

    <br>

    <div>
      <label for="edit-birth-date">Data di nascita</label><br>
      <input type="date" id="edit-birth-date">
    </div>

    <br>

    <button type="submit">Salva</button>
    <button type="button" id="cancel-button">Annulla</button>
  </form>

  <p><a id="back-to-area-link" href="#">Torna all'Area</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="membro.js"></script>

</body>
</html>
