<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea Area - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>

<body class="account-page">

  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card account-page-shell create-area-page">
    <header class="account-page-heading">
      <div><h1>Crea una nuova Area</h1></div>
    </header>

    <form id="area-form">
    <div>
      <label for="area-name">Nome Area</label><br>
      <input type="text" id="area-name" required>
    </div>

    <br>

    <div>
      <label for="area-type">Tipo di Area</label><br>
      <select id="area-type">
        <option value="family">Famiglia</option>
        <option value="school">Scuola</option>
        <option value="sport">Sport</option>
        <option value="friends">Amici</option>
        <option value="course">Corso</option>
        <option value="travel">Viaggio</option>
        <option value="other">Altro</option>
      </select>
    </div>

    <br>

    <button type="submit">Crea Area</button>
    </form>

    <p id="message" aria-live="polite"></p>
  </main>

  <style>
    .create-area-page{width:min(100%,1060px)}
    .create-area-page>.account-page-heading,.create-area-page>#area-form{width:min(100%,780px);max-width:none;margin-right:auto;margin-left:auto}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="crea-area.js"></script>

</body>
</html>
