<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Il mio profilo - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="profile-title">
      <div class="fa-section-hero-content">
        <p class="eyebrow">ACCOUNT</p>
        <h1 id="profile-title">Il mio profilo</h1>
        <p>Gestisci le informazioni del tuo account.</p>
      </div>
    </header>

    <p id="profile-message" class="profile-message fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento profilo...</p>

    <div id="profile-content" class="fa-v2-page-stack" hidden>
      <section class="profile-avatar-section fa-v2-section-card fa-v2-card" aria-labelledby="avatar-title">
        <div id="avatar-fallback" class="profile-avatar profile-avatar-fallback" aria-hidden="true"></div>
        <img id="avatar-image" class="profile-avatar profile-avatar-image" alt="" hidden>
        <div class="profile-avatar-actions fa-v2-page-stack">
          <div class="fa-v2-section-heading">
            <h2 id="avatar-title">Foto profilo</h2>
            <p>JPG, PNG o WebP, massimo 2 MB.</p>
          </div>
          <input id="avatar-file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <div class="fa-v2-card-actions">
            <label id="avatar-upload-label" class="fa-v2-button fa-v2-button--secondary profile-avatar-upload" for="avatar-file-input">Aggiungi foto</label>
            <button id="avatar-remove-button" type="button" class="fa-v2-button fa-v2-button--secondary" hidden>Rimuovi foto</button>
          </div>
        </div>
      </section>

      <form id="profile-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack">
        <div class="fa-v2-section-heading">
          <h2>Informazioni personali</h2>
          <p>Aggiorna i dati associati al tuo account.</p>
        </div>
        <div>
          <label for="profile-first-name">Nome *</label>
          <input id="profile-first-name" class="fa-v2-input" type="text" required autocomplete="given-name">
        </div>
        <div>
          <label for="profile-last-name">Cognome</label>
          <input id="profile-last-name" class="fa-v2-input" type="text" autocomplete="family-name">
        </div>
        <div class="fa-v2-page-stack">
          <label for="profile-email">Email</label>
          <div class="fa-v2-page-stack">
            <input id="profile-email" class="fa-v2-input" type="email" readonly aria-readonly="true" autocomplete="email">
            <a class="fa-v2-button fa-v2-button--secondary" href="condividi-contatto.html">Condividi il mio contatto</a>
          </div>
          <p class="field-help">L’email è gestita dal tuo account di accesso.</p>
        </div>
        <div hidden>
          <label for="profile-phone">Cellulare</label>
          <input id="profile-phone" class="fa-v2-input" type="tel" inputmode="tel" autocomplete="tel">
        </div>
        <div>
          <label for="profile-birth-date">Data di nascita</label>
          <input id="profile-birth-date" class="fa-v2-input" type="date" autocomplete="bday">
        </div>
        <div class="fa-v2-card-actions">
          <button id="profile-save-button" class="fa-v2-button fa-v2-button--primary" type="submit">Salva modifiche</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="profilo.js"></script>
</body>
</html>
