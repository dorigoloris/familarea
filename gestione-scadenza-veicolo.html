<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Gestione scadenza - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="deadline-management-page-view fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack deadline-management-page" data-deadline-management-content hidden>
    <p class="account-back-link"><a id="vehicle-deadline-back-link" href="gestione-scadenze-veicoli.html">Torna al Veicolo</a></p>
    <p id="vehicle-deadline-message" class="deadline-management-message fa-v2-status" aria-live="polite">Caricamento scadenza...</p>
    <div id="vehicle-deadline-content" class="fa-v2-page-stack" hidden>
      <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="vehicle-deadline-title">
        <div class="fa-section-hero-content">
          <p id="item-deadline-category" class="eyebrow">ELEMENTO</p>
          <h1 id="vehicle-deadline-title"></h1>
          <p id="vehicle-deadline-vehicle"></p>
        </div>
      </header>
      <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="vehicle-deadline-next-title">
        <h2 id="vehicle-deadline-next-title">Prossima scadenza</h2>
        <p id="vehicle-deadline-next-date"></p>
        <p id="vehicle-deadline-meta"></p>
        <div class="fa-v2-card-actions"><a id="vehicle-deadline-edit" class="fa-v2-button fa-v2-button--secondary" href="#">Modifica</a></div>
      </section>
      <section class="deadline-attachments-section fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="deadline-attachments-title">
        <div class="fa-v2-section-heading">
          <div><h2 id="deadline-attachments-title">Allegati</h2><p class="deadline-attachments-intro">Conserva qui i documenti relativi a questa scadenza.</p></div>
          <label id="deadline-attachment-upload" class="fa-v2-button fa-v2-button--secondary deadline-attachment-upload" for="deadline-attachment-input">+ Aggiungi allegato</label>
          <input id="deadline-attachment-input" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" hidden>
        </div>
        <p id="deadline-attachments-message" class="deadline-attachments-message" aria-live="polite"></p>
        <p id="deadline-attachments-empty" class="deadline-attachments-empty">Nessun allegato.</p>
        <div id="deadline-attachments-list" class="deadline-attachments-list"></div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="date-utils.js"></script>
  <script src="gestione-scadenze.js"></script>
  <script src="attachment-preview.js"></script>
  <script src="deadline-attachments.js"></script>
  <script src="gestione-scadenza-veicolo.js"></script>
</body>
</html>
