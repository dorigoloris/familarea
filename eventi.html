<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventi - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card">
    <div id="contextual-events-content">
      <p id="back-container" hidden><a id="back-link" href="#">Torna all'Area</a></p>
      <div class="section-heading"><div><p id="section-kicker" class="section-kicker" hidden>Area</p><h1>Programma</h1><p id="page-intro" class="page-intro">Gli eventi visibili nelle tue Aree.</p></div><a id="new-event-link" class="btn" href="#" hidden>Aggiungi al programma</a></div>
      <p id="contextual-message" aria-live="polite">Caricamento programma...</p>
      <div id="contextual-events-list" class="dashboard-list"></div>
    </div>

    <div id="global-events-content" class="fa-page" hidden>
      <header class="global-activities-page-header" aria-labelledby="global-events-title">
        <div class="global-activities-page-heading"><p class="eyebrow">Eventi</p><h1 id="global-events-title">Eventi</h1><p>Gli eventi delle tue Aree, tutti in un unico posto.</p></div><a class="fa-button fa-button-primary" href="nuovo-evento.html">+ Nuovo evento</a>
      </header>
      <p id="global-message" class="global-view-message" aria-live="polite">Caricamento eventi...</p>
      <section id="global-events-section" class="global-activities-surface fa-surface" hidden aria-label="Elenco eventi">
        <div id="global-events-list" class="global-activities-list"></div>
        <p id="events-empty" class="global-activities-empty fa-empty-state" hidden><strong>Nessun evento.</strong></p>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="eventi.js"></script>
</body>
</html>
