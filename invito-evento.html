<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Invito attività - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <main class="fa-v2-page fa-v2-page-stack">
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="event-invite-title">
      <div class="fa-section-hero-content">
        <h1 id="event-invite-title">Invito attività</h1>
        <p>Rispondi all'invito per aggiornare la tua partecipazione.</p>
      </div>
    </header>
    <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="event-invite-title">
      <p id="event-invite-message" class="fa-v2-status" aria-live="polite">Verifica invito…</p>
      <div id="event-invite-actions" class="fa-v2-card-actions" hidden>
        <button id="decline-event-invite" class="fa-v2-button fa-v2-button--secondary" type="button">Rifiuta</button>
        <button id="accept-event-invite" class="fa-v2-button fa-v2-button--primary" type="button">Accetta invito</button>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="invito-evento.js"></script>
</body>
</html>
