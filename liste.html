<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card lists-page">
    <p id="back-link-container"><a id="back-link" href="#">Torna all'Area</a></p>
    <div class="section-heading">
      <div><p class="section-kicker" id="area-name">Area</p><h1>Liste</h1></div>
      <button id="new-list-button" class="btn" type="button">Nuova lista</button>
    </div>
    <p id="message" aria-live="polite">Caricamento liste...</p>
    <section id="area-picker" hidden aria-labelledby="area-picker-title">
      <h2 id="area-picker-title">Scegli l'Area</h2>
      <p id="area-picker-message">Scegli l'Area in cui creare la nuova lista.</p>
      <form id="area-picker-form">
        <label for="area-picker-select">Area</label>
        <select id="area-picker-select" required></select>
        <div class="form-actions">
          <button type="submit">Continua</button>
          <button id="cancel-area-picker" class="secondary-button" type="button">Annulla</button>
        </div>
      </form>
    </section>
    <div id="lists-list" class="lists-list"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="liste.js"></script>
</body>
</html>
