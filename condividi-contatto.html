<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Condividi il mio contatto - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a href="profilo.html">Torna al Profilo</a></p>
    <header class="fa-v2-header-card fa-v2-card" aria-labelledby="share-contact-title">
      <div class="fa-section-hero-content">
        <h1 id="share-contact-title">Condividi il mio contatto</h1>
        <p>Crea un link personale per condividere nome, cognome ed email verificata.</p>
      </div>
    </header>
    <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="create-share-title">
      <div class="fa-v2-section-heading">
        <h2 id="create-share-title">Crea link</h2>
      </div>
      <form id="share-form" class="fa-v2-page-stack">
        <div>
          <label for="recipient-email">Email del destinatario</label>
          <input id="recipient-email" class="fa-v2-input" type="email" required autocomplete="email">
        </div>
        <div class="fa-v2-card-actions">
          <button class="fa-v2-button fa-v2-button--primary" type="submit">Crea link</button>
        </div>
      </form>
      <p id="message" class="fa-v2-status fa-v2-stack-optional" aria-live="polite"></p>
      <section id="created" class="fa-v2-notice fa-v2-notice--success fa-v2-page-stack" hidden aria-label="Link creato">
        <p>Link creato. Puoi inviarlo alla persona con cui vuoi condividere il tuo contatto.</p>
        <input id="share-link" class="fa-v2-input" readonly>
        <div class="fa-v2-card-actions">
          <button id="copy-link" class="fa-v2-button fa-v2-button--secondary" type="button">Copia link</button>
        </div>
      </section>
    </section>
    <section class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="pending-shares-title">
      <div class="fa-v2-section-heading">
        <h2 id="pending-shares-title">Link in attesa</h2>
      </div>
      <div id="pending" class="fa-v2-list" aria-live="polite">Caricamento…</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="condividi-contatto.js"></script>
</body>
</html>
