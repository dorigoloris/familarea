<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Fotografie condivise - FamilArea</title>
  <link rel="stylesheet" href="app.css">
  <style>
    .shared-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--fa-v2-space-3)}
    .shared-photo-tile{display:grid;min-height:132px;place-items:center;overflow:hidden;border:1px solid var(--fa-v2-border);border-radius:12px;background:#f4f8fa;color:var(--fa-v2-muted);cursor:pointer}
    .shared-photo-tile:focus-visible{outline:3px solid rgba(77,139,79,.3);outline-offset:2px}.shared-photo-tile img{display:block;width:100%;height:100%;min-height:132px;object-fit:cover}
    .shared-photo-tile[disabled]{cursor:default;opacity:.72}.shared-photo-viewer{margin-top:var(--fa-v2-space-5)}
    .shared-photo-viewer .memory-gallery-photo-stage{min-height:280px}.shared-photo-viewer[hidden]{display:none}
    @media(max-width:700px){.shared-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--fa-v2-space-2)}.shared-photo-tile,.shared-photo-tile img{min-height:112px}}
  </style>
</head>
<body class="fa-v2-app">
  <main class="fa-v2-page fa-v2-page-stack">
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="shared-photos-title">
      <div class="fa-section-hero-content">
        <h1 id="shared-photos-title">Fotografie condivise</h1>
        <p>Puoi visualizzare soltanto le fotografie incluse in questa condivisione.</p>
      </div>
    </header>

    <p id="shared-photos-message" class="fa-v2-status" aria-live="polite">Caricamento fotografie...</p>

    <section id="shared-photos-login" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="shared-photos-login-title" hidden>
      <div class="fa-v2-section-heading"><h2 id="shared-photos-login-title">Accedi per continuare</h2></div>
      <p>Accedi con l'account che ha accettato questa condivisione.</p>
      <div class="fa-v2-card-actions">
        <a id="shared-photos-login-link" class="fa-v2-button fa-v2-button--primary" href="login.html">Accedi</a>
      </div>
    </section>

    <section id="shared-photos-content" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-labelledby="shared-photos-content-title" hidden>
      <div class="fa-v2-section-heading"><h2 id="shared-photos-content-title">Fotografie</h2></div>
      <p id="shared-photos-empty" class="fa-v2-empty-state" hidden>Al momento non ci sono fotografie disponibili.</p>
      <div id="shared-photos-grid" class="shared-photo-grid" aria-label="Fotografie condivise"></div>

      <section id="shared-photo-viewer" class="shared-photo-viewer memory-gallery-photos" aria-label="Fotografia selezionata" hidden>
        <div class="memory-gallery-photo-stage">
          <img id="shared-photo-viewer-image" alt="Fotografia condivisa">
        </div>
        <div class="fa-v2-card-actions">
          <button id="shared-photo-viewer-close" class="fa-v2-button fa-v2-button--secondary" type="button">Chiudi fotografia</button>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="auth-utils.js"></script>
  <script src="foto-condivise.js"></script>
</body>
</html>
