<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>I miei Interessi - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="fa-v2-page fa-page--wide fa-v2-page-stack">
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="interests-title">
      <div class="fa-section-hero-content">
        <p class="eyebrow">INTERESSI</p>
        <h1 id="interests-title">I miei Interessi</h1>
        <p>Scegli ciò che ti interessa e personalizza le proposte di FamilArea.</p>
      </div>
    </header>
    <p id="interests-message" class="fa-v2-status fa-v2-stack-optional interests-message" aria-live="polite">Caricamento interessi...</p>
    <section id="interests-section" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" hidden aria-label="I miei interessi">
      <div id="interests-categories" class="interests-categories"></div>
      <p id="interests-catalog-empty" class="interests-empty fa-empty-state" hidden><strong>Il catalogo degli interessi non è ancora disponibile.</strong></p>
      <section class="interest-proposal" aria-labelledby="interest-proposal-title">
        <div>
          <h2 id="interest-proposal-title">Non trovi la categoria giusta?</h2>
          <p>Proponi una nuova categoria e aiutaci a migliorare FamilArea.</p>
        </div>
        <button id="interest-proposal-toggle" class="fa-v2-button fa-v2-button--secondary" type="button" aria-expanded="false" aria-controls="interest-proposal-form">+ Proponi una categoria</button>
        <form id="interest-proposal-form" class="interest-proposal-form fa-v2-form-card fa-v2-card" hidden>
          <div>
            <label for="interest-proposal-name">Nome categoria</label>
            <input id="interest-proposal-name" class="fa-v2-input" name="proposed_name" type="text" maxlength="100" required autocomplete="off" placeholder="Es. Motori">
          </div>
          <div>
            <label for="interest-proposal-note">Nota facoltativa</label>
            <textarea id="interest-proposal-note" class="fa-v2-textarea" name="note" maxlength="500" rows="3" placeholder="Es. Mi interessano automobilismo, moto e auto d'epoca"></textarea>
          </div>
          <div class="interest-proposal-actions">
            <button id="interest-proposal-cancel" class="fa-v2-button fa-v2-button--secondary" type="button">Annulla</button>
            <button id="interest-proposal-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Invia proposta</button>
          </div>
        </form>
        <p id="interest-proposal-message" class="interest-proposal-message" aria-live="polite" hidden></p>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="interessi.js"></script>
</body>
</html>
