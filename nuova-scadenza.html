<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuova scadenza - FamilArea</title><link rel="stylesheet" href="app.css"></head>
<body class="deadline-form-page-view fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button><p id="logout-message" aria-live="polite"></p>
  <main class="page-card fa-page fa-page--wide fa-v2-page fa-v2-page-stack deadline-form-page">
    <p class="account-back-link"><a id="deadline-back-link" href="scadenze.html">Torna alle Scadenze</a></p>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="deadline-form-title"><div class="fa-section-hero-content"><h1 id="deadline-form-title">Gestione scadenza</h1><p id="deadline-form-intro">Inserisci le informazioni essenziali per non dimenticare nulla.</p></div></header>
    <div id="managed-context" hidden></div>
    <p id="deadline-form-message" class="deadlines-message fa-v2-status fa-v2-stack-optional" aria-live="polite">Caricamento...</p>
    <form id="deadline-form" class="deadline-form fa-v2-card fa-v2-section-card fa-v2-form-card" hidden>
      <fieldset id="deadline-type-choice" class="fa-choice-fieldset" hidden><legend>Tipo</legend><div class="fa-choice-options"><label><input type="radio" name="deadline-type" value="deadline" checked> Scadenza</label><label><input type="radio" name="deadline-type" value="appointment"> Appuntamento</label></div><p id="deadline-type-note" class="field-help"></p></fieldset>
      <div class="deadline-form-grid"><div><label for="deadline-title">Titolo *</label><input id="deadline-title" class="fa-v2-input" type="text" required></div><datalist id="vehicle-deadline-suggestions"><option value="Bollo"></option><option value="RCA"></option><option value="Revisione"></option><option value="Tagliando"></option><option value="Cambio gomme"></option><option value="Altro"></option></datalist><div><label for="deadline-category">Categoria *</label><select id="deadline-category" class="fa-v2-select" required><option value="" disabled selected>Seleziona categoria</option><option value="vehicle">Auto e veicoli</option><option value="home">Casa</option><option value="documents">Documenti</option><option value="animals">Animali</option><option value="contracts_subscriptions">Contratti e abbonamenti</option><option value="other">Altro</option></select></div><div id="deadline-reference-field"><label for="deadline-reference">Riferimento</label><input id="deadline-reference" class="fa-v2-input" type="text" placeholder="Es. Fiat 500"></div><div id="deadline-item-selector-field" hidden><label for="deadline-item-selector">Associata a</label><select id="deadline-item-selector" class="fa-v2-select"><option value="" selected>Seleziona elemento</option></select></div><div id="deadline-family-member-field"><label for="deadline-family-member">Membro Famiglia</label><select id="deadline-family-member" class="fa-v2-select"><option value="" selected>Seleziona membro</option></select></div><div id="deadline-managed-member" class="field-help" hidden></div><div id="deadline-item-context" class="field-help" hidden></div><div><label for="deadline-first-due-on">Data prima scadenza *</label><input id="deadline-first-due-on" class="fa-v2-input" type="date" required></div><div class="deadline-time-field"><label for="deadline-start-time">Ora inizio</label><input id="deadline-start-time" class="fa-v2-input" type="time"></div><div class="deadline-time-field"><label for="deadline-end-time">Ora fine</label><input id="deadline-end-time" class="fa-v2-input" type="time"></div><div><label for="deadline-recurrence">Ricorrenza</label><select id="deadline-recurrence" class="fa-v2-select"><option value="" disabled selected>Seleziona ricorrenza</option><option value="none">Non ripetere</option><option value="1">Ogni mese</option><option value="6">Ogni 6 mesi</option><option value="12">Ogni anno</option><option value="24">Ogni 2 anni</option></select></div><div><label for="deadline-reminder">Promemoria</label><select id="deadline-reminder" class="fa-v2-select"><option value="" disabled selected>Seleziona promemoria</option><option value="0">Il giorno stesso</option><option value="7">7 giorni prima</option><option value="15">15 giorni prima</option><option value="30">30 giorni prima</option></select></div></div>
      <div><label for="deadline-notes">Note</label><textarea id="deadline-notes" class="fa-v2-textarea" rows="4"></textarea></div><div class="form-actions"><button id="deadline-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Crea scadenza</button><a id="deadline-cancel-link" class="btn secondary-button fa-v2-button fa-v2-button--secondary" href="scadenze.html">Annulla</a></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-public-config.js"></script><script src="logout.js"></script><script src="navigation.js"></script><script src="managed-context.js"></script><script src="nuova-scadenza.js"></script>
</body>
</html>
