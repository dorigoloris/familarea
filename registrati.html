<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Registrati - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <main class="fa-v2-page fa-v2-page-stack">
    <a class="fa-v2-button fa-v2-button--secondary" href="index.html">FamilArea</a>
    <header class="fa-section-hero fa-v2-header-card fa-v2-card" aria-labelledby="signup-title">
      <div class="fa-section-hero-content"><p class="eyebrow">NUOVO ACCOUNT</p><h1 id="signup-title">Registrati a FamilArea</h1><p>Scegli un account Persona o Organization: ogni account conserva dati e autorizzazioni separati.</p></div>
    </header>
    <form id="signup-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack">
      <fieldset class="fa-choice-fieldset"><legend>Tipo di account</legend><div class="fa-choice-options"><label><input type="radio" name="account-type" value="personal" checked> Persona</label><label><input type="radio" name="account-type" value="organization"> Organizzazione</label></div></fieldset>
      <div id="personal-signup-fields" class="fa-v2-page-stack"><div><label for="first-name">Nome</label><input id="first-name" class="fa-v2-input" type="text" autocomplete="given-name" required></div><div><label for="last-name">Cognome <span>facoltativo</span></label><input id="last-name" class="fa-v2-input" type="text" autocomplete="family-name"></div></div>
      <div id="organization-signup-fields" class="fa-v2-page-stack" hidden><div><label for="organization-name">Nome organizzazione</label><input id="organization-name" class="fa-v2-input" type="text" autocomplete="organization"></div><div><label for="organization-type">Tipo organizzazione</label><select id="organization-type" class="fa-v2-select"><option value="">Seleziona un tipo</option><option value="Associazione">Associazione</option><option value="Cultura / Spettacolo">Cultura / Spettacolo</option><option value="Sport">Sport</option><option value="Scuola / Formazione">Scuola / Formazione</option><option value="Altro">Altro</option></select></div></div>
      <div><label for="email">Email</label><input id="email" class="fa-v2-input" type="email" autocomplete="email" required></div>
      <div><label for="password">Password</label><input id="password" class="fa-v2-input" type="password" autocomplete="new-password" minlength="8" required><p class="field-help">Usa almeno 8 caratteri.</p></div>
      <div class="fa-v2-card-actions"><a id="login-link" class="fa-v2-button fa-v2-button--secondary" href="login.html">Hai già un account?</a><button id="signup-submit" class="fa-v2-button fa-v2-button--primary" type="submit">Registrati</button></div>
    </form>
    <p id="message" class="fa-v2-status" aria-live="polite"></p>
    <section id="google-sign-in-section" class="fa-v2-section-card fa-v2-card fa-v2-page-stack" aria-label="Registrazione con Google"><button id="google-sign-in" class="fa-v2-button fa-v2-button--secondary" type="button">Continua con Google</button></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="auth-utils.js"></script>
  <script src="registrati.js"></script>
</body>
</html>
