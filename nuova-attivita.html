<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d2b4f">
  <title>Nuova attivit&agrave; - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="fa-v2-app">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card fa-v2-page fa-page--wide fa-v2-page-stack">
    <p class="account-back-link"><a id="back-link" href="attivita-globali.html">Torna alle Attivit&agrave;</a></p>
    <header class="fa-v2-header-card fa-v2-card">
      <p class="eyebrow">ATTIVIT&Agrave;</p>
      <h1>Nuova attivit&agrave;</h1>
    </header>
    <p id="message" class="fa-v2-status" aria-live="polite">Caricamento...</p>

    <form id="activity-form" class="fa-v2-section-card fa-v2-form-card fa-v2-card fa-v2-page-stack" hidden>
      <div class="fa-v2-page-stack">
        <label for="title">Titolo<input id="title" class="fa-v2-input" type="text" required></label>
        <label for="activity-type">Tipo<select id="activity-type" class="fa-v2-select"><option value="task">Da fare</option><option value="reminder">Promemoria</option><option value="deadline">Scadenza</option><option value="appointment">Appuntamento</option></select></label>
        <label for="priority">Priorit&agrave;<select id="priority" class="fa-v2-select"><option value="normal">Normale</option><option value="low">Bassa</option><option value="high">Alta</option></select></label>
        <label for="notes">Note<textarea id="notes" class="fa-v2-textarea"></textarea></label>
      </div>

      <fieldset class="activity-due-fields">
        <legend>Quando</legend>
        <div class="activity-dates">
          <label for="activity-date">Data<input id="activity-date" class="fa-v2-input" type="date"></label>
          <label for="start-time">Ora inizio<input id="start-time" class="fa-v2-input" type="time"></label>
          <label for="end-time">Ora fine<input id="end-time" class="fa-v2-input" type="time"></label>
        </div>
        <label class="activity-recurrence-toggle"><input id="recurrence-enabled" type="checkbox"> Ripeti questa attivit&agrave;</label>
        <div id="recurrence-fields" class="activity-recurrence-fields" hidden>
          <label for="recurrence-weekday">Ripeti ogni<select id="recurrence-weekday" class="fa-v2-select"><option value="1">Luned&igrave;</option><option value="2">Marted&igrave;</option><option value="3">Mercoled&igrave;</option><option value="4">Gioved&igrave;</option><option value="5">Venerd&igrave;</option><option value="6">Sabato</option><option value="7">Domenica</option></select></label>
          <label for="recurrence-until">Fine ripetizione<input id="recurrence-until" class="fa-v2-input" type="date"></label>
        </div>
      </fieldset>

      <div class="fa-v2-card-actions">
        <button type="button" id="cancel-button" class="fa-button fa-button-secondary">Annulla</button>
        <button type="submit" id="save-button" class="fa-button fa-button-primary">Crea attivit&agrave;</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="nuova-attivita.js"></script>
</body>
</html>
