<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>
  <main class="page-card event-detail-page">
    <p class="event-detail-back"><a id="back-link" href="#">Torna agli eventi</a></p>
    <header class="event-detail-heading">
      <div class="event-detail-title-block"><p class="eyebrow">PROGRAMMA</p><h1 id="event-title">Evento</h1></div>
      <div id="creator-actions" class="event-detail-actions" hidden>
        <button id="edit-button" class="fa-button fa-button-primary" type="button">Modifica</button>
        <button id="delete-button" class="area-delete-button" type="button">Elimina evento</button>
      </div>
    </header>
    <p id="message" aria-live="polite">Caricamento...</p>
    <section id="event-view" class="event-detail-card" hidden>
      <dl class="event-detail-list">
        <dt>Data e ora</dt><dd id="when"></dd>
        <dt>Luogo</dt><dd id="location"></dd>
        <dt>Stato</dt><dd class="event-status-value"><span id="status"></span><span id="status-editor" class="event-status-editor"><label for="status-select">Cambia stato</label><select id="status-select"><option value="active">Attivo</option><option value="cancelled">Annullato</option></select><button id="save-status" class="fa-button fa-button-secondary fa-button-compact" type="button">Salva stato</button></span></dd>
        <dt id="participants-label">Partecipanti</dt><dd id="participant-list" class="event-participant-list"></dd>
        <dt id="recurrence-label" hidden>Ripetizione</dt><dd id="recurrence" hidden></dd>
        <dt>Note</dt><dd id="notes" class="event-detail-notes"></dd>
      </dl>
    </section>
    <form id="edit-form" class="event-edit-form" hidden>
      <h2>Modifica evento</h2>
      <label for="edit-title">Titolo</label><input id="edit-title" required>
      <br><br>
      <label for="edit-notes">Note</label><textarea id="edit-notes"></textarea>
      <br><br>
      <div id="edit-start-dates" class="event-dates">
        <div><label for="edit-date">Data</label><input id="edit-date" type="date" required></div>
        <div id="edit-start-time-field"><label for="edit-start">Ora inizio</label><input id="edit-start" type="time"></div>
        <div id="edit-end-time-normal-slot"><div id="edit-end-time-field"><label for="edit-end">Ora fine</label><input id="edit-end" type="time"></div></div>
      </div>
      <div class="event-form-options">
        <label class="event-form-option"><input id="edit-all-day" type="checkbox"><span>Tutto il giorno</span></label>
        <label class="event-form-option"><input id="edit-multi-day" type="checkbox"><span>Più giorni</span></label>
        <div id="edit-multi-day-end-row" class="event-dates event-multi-day-end" hidden>
          <div><label for="edit-end-date">Data fine</label><input id="edit-end-date" type="date"></div>
          <div id="edit-end-time-multi-day-slot"></div>
        </div>
        <label class="event-form-option"><input id="edit-recurrence-enabled" type="checkbox"><span>Ripeti ogni settimana</span></label>
      </div>
      <div id="edit-recurrence-fields" class="event-recurrence-fields" hidden><label for="edit-recurrence-until">Fine ripetizione</label><input id="edit-recurrence-until" type="date"></div>
      <br><br>
      <label for="edit-location">Luogo</label><input id="edit-location">
      <br><br>
      <fieldset id="edit-participants-fieldset"><legend>Partecipanti</legend><div id="edit-participants"></div></fieldset>
      <br>
      <div class="form-actions"><button type="submit">Salva modifiche</button><button id="close-edit" class="secondary-button" type="button">Annulla</button></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="confirm-modal.js"></script>
  <script src="evento.js"></script>
</body>
</html>
