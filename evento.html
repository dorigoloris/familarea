<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Evento - FamilArea</title><link rel="stylesheet" href="app.css"></head><body>
<button class="logout-button" type="button" data-logout>Esci</button><p id="logout-message" aria-live="polite"></p><main class="page-card"><p><a id="back-link" href="#">Torna agli eventi</a></p><h1 id="event-title">Evento</h1><p id="message" aria-live="polite">Caricamento...</p><section id="event-view" hidden><dl><dt>Data e ora</dt><dd id="when"></dd><dt>Luogo</dt><dd id="location"></dd><dt>Stato</dt><dd><span id="status"></span><span id="status-editor"><label for="status-select">Cambia stato</label><select id="status-select"><option value="active">Attivo</option><option value="cancelled">Annullato</option></select><button id="save-status" type="button">Salva stato</button></span></dd><dt id="participants-label">Partecipanti</dt><dd id="participant-list"></dd><dt id="recurrence-label" hidden>Ripetizione</dt><dd id="recurrence" hidden></dd><dt>Note</dt><dd id="notes"></dd></dl><p id="creator-actions" hidden><button id="edit-button" type="button">Modifica</button><button id="delete-button" type="button">Elimina evento</button></p></section>
<form id="edit-form" hidden><h2>Modifica evento</h2><label for="edit-title">Titolo</label><input id="edit-title" required><br><br><label for="edit-notes">Note</label><textarea id="edit-notes"></textarea><br><br><div class="event-dates"><div><label for="edit-date">Data</label><input id="edit-date" type="date" required></div><div><label for="edit-start">Ora inizio</label><input id="edit-start" type="time"></div><div><label for="edit-end">Ora fine</label><input id="edit-end" type="time"></div></div><br><label><input id="edit-all-day" type="checkbox"> Tutto il giorno</label><br><label><input id="edit-recurrence-enabled" type="checkbox"> Ripeti ogni settimana</label><div id="edit-recurrence-fields" hidden><label for="edit-recurrence-until">Fine ripetizione</label><input id="edit-recurrence-until" type="date"></div><br><br><label for="edit-location">Luogo</label><input id="edit-location"><br><br><fieldset id="edit-participants-fieldset"><legend>Partecipanti</legend><div id="edit-participants"></div></fieldset><br><button type="submit">Salva modifiche</button><button id="close-edit" type="button">Annulla</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-public-config.js"></script><script src="logout.js"></script><script src="navigation.js"></script><script src="confirm-modal.js"></script><script src="evento.js"></script></body></html>
