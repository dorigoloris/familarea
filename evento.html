<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Evento - FamilArea</title><link rel="stylesheet" href="app.css"></head><body>
<button class="logout-button" type="button" data-logout>Esci</button><p id="logout-message" aria-live="polite"></p><main class="page-card"><p><a id="back-link" href="#">Torna agli eventi</a></p><h1 id="event-title">Evento</h1><p id="message" aria-live="polite">Caricamento...</p><section id="event-view" hidden><dl><dt>Data e ora</dt><dd id="when"></dd><dt>Luogo</dt><dd id="location"></dd><dt>Stato</dt><dd id="status"></dd><dt>Visibilità</dt><dd id="visibility"></dd><dt>Partecipanti</dt><dd id="participant-list"></dd><dt>Note</dt><dd id="notes"></dd></dl><p id="creator-actions" hidden><button id="edit-button" type="button">Modifica</button><button id="cancel-button" type="button">Annulla evento</button><button id="delete-button" type="button">Elimina evento</button></p><fieldset id="participation-box" hidden><legend>La tua partecipazione</legend><select id="participation-status"><option value="pending">Da confermare</option><option value="accepted">Partecipo</option><option value="declined">Non partecipo</option></select></fieldset></section>
<form id="edit-form" hidden><h2>Modifica evento</h2><label for="edit-title">Titolo</label><input id="edit-title" required><br><br><label for="edit-notes">Note</label><textarea id="edit-notes"></textarea><br><br><div class="event-dates"><div><label for="edit-date">Data</label><input id="edit-date" type="date" required></div><div><label for="edit-start">Ora inizio</label><input id="edit-start" type="time"></div><div><label for="edit-end">Ora fine</label><input id="edit-end" type="time"></div></div><br><label><input id="edit-all-day" type="checkbox"> Tutto il giorno</label><br><br><label for="edit-location">Luogo</label><input id="edit-location"><br><br><fieldset><legend>Visibilità</legend><label><input type="radio" name="edit-visibility" value="area"> Tutta l'Area</label><label><input type="radio" name="edit-visibility" value="private"> Solo io</label><label><input type="radio" name="edit-visibility" value="creator_participants"> Persone selezionate</label></fieldset><br><fieldset id="edit-participants-fieldset"><legend>Partecipanti</legend><p id="edit-participants-help"></p><div id="edit-participants"></div></fieldset><br><button type="submit">Salva modifiche</button><button id="close-edit" type="button">Annulla</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-public-config.js"></script><script src="logout.js"></script><script src="navigation.js"></script><script src="confirm-modal.js"></script><script src="evento.js"></script></body></html>
