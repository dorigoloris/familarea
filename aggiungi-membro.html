<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi partecipante - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>

  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <h1>Aggiungi un partecipante</h1>

  <form id="member-form">

    <div>
      <label for="first-name">Nome</label><br>
      <input type="text" id="first-name" required>
    </div>

    <br>

    <div>
      <label for="last-name">Cognome</label><br>
      <input type="text" id="last-name">
    </div>

    <br>

    <div>
      <label for="birth-date">Data di nascita</label><br>
      <input type="date" id="birth-date">
    </div>

    <br>

    <div>
      <label for="role">Ruolo</label><br>
      <select id="role">
        <option value="managed">Profilo gestito</option>
        <option value="member">Partecipante</option>
        <option value="admin">Amministratore</option>
      </select>
    </div>

    <br>

    <button type="submit">Aggiungi partecipante</button>

  </form>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="aggiungi-membro.js"></script>

</body>
</html>
