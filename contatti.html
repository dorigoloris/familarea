<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei Contatti - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="contacts-page-view">
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card contacts-page fa-page fa-page--wide">
    <div class="contacts-page-decoration contacts-page-decoration-one" aria-hidden="true"></div>
    <header class="contacts-page-header" aria-labelledby="contacts-page-title">
      <div class="contacts-page-heading">
        <p class="eyebrow">Rubrica personale</p>
        <h1 id="contacts-page-title">I miei Contatti</h1>
        <p>Le persone che vuoi tenere a portata di mano in FamilArea.</p>
        <a class="btn contacts-primary-action" href="nuovo-contatto.html">Aggiungi contatto</a>
      </div>
      <div class="contacts-header-illustration" aria-hidden="true">
        <svg viewBox="0 0 270 176" focusable="false">
          <rect x="8" y="10" width="254" height="156" rx="31" fill="#e8f3f5"/>
          <circle cx="209" cy="47" r="28" fill="#cce7d1"/>
          <path d="M17 136c35-27 76-16 106-32 39-21 76-7 132 21v41H17Z" fill="#d9ecde"/>
          <circle cx="112" cy="77" r="28" fill="#fff" stroke="#0d2b4f" stroke-width="4"/>
          <circle cx="112" cy="67" r="9" fill="#d8ebdc" stroke="#4d8b4f" stroke-width="3"/>
          <path d="M94 97c4-12 32-12 36 0" fill="none" stroke="#4d8b4f" stroke-width="3" stroke-linecap="round"/>
          <rect x="150" y="75" width="55" height="11" rx="5.5" fill="#dcecf4"/>
          <rect x="150" y="96" width="42" height="10" rx="5" fill="#e5f2e2"/>
          <circle cx="210" cy="117" r="20" fill="#fff3df"/>
          <path d="M202 117h16M210 109v16" fill="none" stroke="#c17b1c" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </header>

    <p id="message" aria-live="polite">Caricamento contatti...</p>
    <section class="contacts-directory-surface fa-surface" aria-label="Elenco contatti">
      <div class="contacts-directory-header" aria-hidden="true">
        <span>Nome e cognome</span><span>Email</span><span>Cellulare</span><span>Data di nascita</span><span>Calendario</span><span></span>
      </div>
      <div id="contacts-list" class="contacts-list"></div>
      <div id="empty-state" class="contacts-empty-state fa-empty-state" hidden>
        <span class="fa-icon-badge contacts-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2M17 10h4M19 8v4"/></svg></span>
        <div><strong>Non hai ancora contatti.</strong><span>Inizia creando la tua rubrica personale.</span></div>
        <a class="btn" href="nuovo-contatto.html">Aggiungi contatto</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="contatti.js"></script>
</body>
</html>
