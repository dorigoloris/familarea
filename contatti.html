<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei Contatti - FamilArea</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <button class="logout-button" type="button" data-logout>Esci</button>
  <p id="logout-message" aria-live="polite"></p>

  <main class="page-card contacts-page">
    <div class="section-heading">
      <h1>I miei Contatti</h1>
      <a class="btn" href="nuovo-contatto.html">Aggiungi contatto</a>
    </div>
    <p id="message" aria-live="polite">Caricamento contatti...</p>
    <div class="contacts-directory-header" aria-hidden="true">
      <span>Nome e cognome</span>
      <span>Email</span>
      <span>Cellulare</span>
      <span>Data di nascita</span>
      <span>Calendario</span>
      <span></span>
    </div>
    <div id="contacts-list" class="contacts-list"></div>
    <div id="empty-state" class="contacts-empty-state" hidden>
      <p>Non hai ancora contatti.</p>
      <a class="btn" href="nuovo-contatto.html">Aggiungi contatto</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-public-config.js"></script>
  <script src="logout.js"></script>
  <script src="navigation.js"></script>
  <script src="contatti.js"></script>
</body>
</html>
